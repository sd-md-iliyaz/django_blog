{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    {% include 'dashboard/sidebar.html' %}
     <div class='col-md-9'>
        
            <h3>Edit post</h3>
            <form action="{% url 'edit_post' post.id %}" method="POST" style="width:500px;">
                {% csrf_token %}
                {{ form | crispy }}
                <br>
                <button type="submit" class='btn btn-warning'>Edit</button>
            </form>
        
     </div>
</div>
{% endblock %}
